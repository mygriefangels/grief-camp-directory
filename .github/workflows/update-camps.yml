name: Update grief camp directory

on:
  schedule:
    # 8:00 UTC on the 1st of every month (12 runs per year)
    - cron: "0 8 1 * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if camps.json is recent"
        required: false
        default: "no"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install anthropic

      - name: Research camps and update camps.json
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FORCE_RUN: ${{ github.event.inputs.force }}
        run: python update_camps.py

      - name: Commit updated directory
        run: |
          git config user.name "camp-directory-bot"
          git config user.email "actions@users.noreply.github.com"
          git add camps.json latest-run-review.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Monthly camp directory update"
            git push
          fi
